name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        # Placeholder for Compose interpolation validation; not a real volume.
        env:
          OPENWEBUI_VOLUME_NAME: ci_openwebui_data
        run: docker compose config
